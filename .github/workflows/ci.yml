name: CI

on:
  push:
  pull_request:
    branches: [main]

# Only the newest run per ref matters; cancel superseded ones so a branch that
# is pushed repeatedly does not queue behind its own stale runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: make install
      - run: make lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: make install
      - run: make test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: make install
      - run: make build
      # Typecheck rides the build job: it needs the build's generated
      # components.d.ts and the lib/ui dist types, all already on this runner.
      - run: pnpm --filter @blueprint-chart/editor typecheck

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Browsers + all system deps are pre-baked into this image, so there is no
    # download and no apt step. Keep the tag in sync with the @playwright/test
    # version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      # The Playwright image is minimal and ships no `make`; install it so this
      # job can reuse the same Makefile targets as every other CI job.
      - run: apt-get update && apt-get install -y --no-install-recommends make
      - run: make install
      - run: make test-e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
