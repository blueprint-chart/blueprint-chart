name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: compute version + notes, skip publish/deploy"
        type: boolean
        default: true

permissions:
  contents: write      # push the release commit + create the tag/release
  issues: write        # semantic-release github plugin
  pull-requests: write # semantic-release github plugin
  id-token: write      # npm OIDC trusted publishing (provenance)

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11'

jobs:
  release:
    name: Release
    # Run on manual dispatch, or only when the triggering CI run succeeded.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          # On workflow_run, check out the exact commit CI validated.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0          # semantic-release needs full history + tags
          persist-credentials: true
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: make install
      - run: make build
      - name: Upload package dists
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            packages/lib/dist
            packages/ui/dist
            packages/editor/dist
          if-no-files-found: error
          retention-days: 1
      - name: Upload docs dist
        uses: actions/upload-artifact@v7
        with:
          name: docs-dist
          path: packages/docs/src/.vitepress/dist
          if-no-files-found: error
          retention-days: 1
      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v5
        with:
          dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
          # semantic_version pins the release runtime to the major this repo
          # declares (^25.0.9); the action otherwise runs its own bundled 24.
          # The preset is pinned to 9 rather than 10 on purpose. Preset 10.3+
          # plants a poison mainTemplate (@conventional-changelog/template,
          # createLegacyWriterGuard) that makes conventional-changelog-writer@8
          # throw 'Missing helper' instead of silently writing an empty
          # changelog. Only writer 9 ignores it, and no stable
          # @semantic-release/release-notes-generator ships one: 14.1.1 is the
          # latest and pins writer ^8, so preset 10 cannot render here at all.
          # Pinning writer 9 alongside it does not help either, because the
          # copy generateNotes resolves is nested inside release-notes-generator.
          semantic_version: 25
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/exec
            @semantic-release/git
            conventional-changelog-conventionalcommits@9
        env:
          # npm auth is via OIDC trusted publishing (id-token: write above) — no NODE_AUTH_TOKEN needed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

  deploy-pages:
    name: Deploy editor to blueprintchart.com
    needs: [release]
    if: ${{ needs.release.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download package dists
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: packages
      - name: Mint installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BLUEPRINT_BOT_APP_ID }}
          private-key: ${{ secrets.BLUEPRINT_BOT_PRIVATE_KEY }}
          owner: blueprint-chart
          repositories: blueprintchart.com
      - name: Checkout Pages repo
        uses: actions/checkout@v6
        with:
          repository: blueprint-chart/blueprintchart.com
          token: ${{ steps.app-token.outputs.token }}
          path: pages
          fetch-depth: 1
      - name: Replace Pages repo contents with editor dist
        run: |
          set -euo pipefail
          find pages -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -R packages/editor/dist/. pages/
          ls -la pages/
      - name: Write runtime config.json
        working-directory: pages
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          jq -n \
            --arg url "$SUPABASE_URL" \
            --arg key "$SUPABASE_ANON_KEY" \
            '{supabaseUrl: $url, supabaseAnonKey: $key}' > config.json
          cat config.json
      - name: Inject Umami analytics snippet
        working-directory: pages
        env:
          UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${UMAMI_WEBSITE_ID:-}" ]; then
            echo "UMAMI_WEBSITE_ID not set; skipping analytics injection."
            exit 0
          fi
          node - "$UMAMI_WEBSITE_ID" <<'EOF'
          const { readFileSync, writeFileSync } = require('node:fs')
          const [websiteId] = process.argv.slice(2)
          const file = 'index.html'
          let html = readFileSync(file, 'utf8')
          if (html.includes('data-website-id')) {
            console.log('Umami snippet already present; skipping.')
            process.exit(0)
          }
          const closeHead = html.indexOf('</head>')
          if (closeHead === -1) {
            console.error('No </head> found in index.html; cannot inject Umami.')
            process.exit(1)
          }
          const snippet = [
            '  <script defer',
            '    src="https://cloud.umami.is/script.js"',
            `    data-website-id="${websiteId}"`,
            '    data-do-not-track="true"></script>',
            '',
          ].join('\n')
          html = html.slice(0, closeHead) + snippet + html.slice(closeHead)
          writeFileSync(file, html)
          console.log('Injected Umami snippet.')
          EOF
          grep -q 'data-website-id' index.html
          echo "Verified: Umami snippet present in index.html"
      - name: Commit and push
        working-directory: pages
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DEPLOY_TAG: v${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "blueprint-chart-bot[bot]"
          git config user.email "blueprint-chart-bot[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi
          git commit -m "chore: deploy editor $DEPLOY_TAG"
          git push origin HEAD:main

  deploy-docs:
    name: Deploy docs to docs.blueprintchart.com
    needs: [release]
    if: ${{ needs.release.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download docs dist
        uses: actions/download-artifact@v8
        with:
          name: docs-dist
          path: docs-dist
      - name: Mint installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BLUEPRINT_BOT_APP_ID }}
          private-key: ${{ secrets.BLUEPRINT_BOT_PRIVATE_KEY }}
          owner: blueprint-chart
          repositories: docs.blueprintchart.com
      - name: Checkout docs Pages repo
        uses: actions/checkout@v6
        with:
          repository: blueprint-chart/docs.blueprintchart.com
          token: ${{ steps.app-token.outputs.token }}
          path: pages-docs
          fetch-depth: 1
      - name: Replace docs Pages repo contents with VitePress dist
        run: |
          set -euo pipefail
          find pages-docs -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -R docs-dist/. pages-docs/
          ls -la pages-docs/
      - name: Commit and push
        working-directory: pages-docs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DEPLOY_TAG: v${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "blueprint-chart-bot[bot]"
          git config user.email "blueprint-chart-bot[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi
          git commit -m "chore: deploy docs $DEPLOY_TAG"
          git push origin HEAD:main
